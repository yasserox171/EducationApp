name: education_app
description: >-
  تطبيق تعليمي لمركز واحد (أستاذ واحد + تلاميذ) — واجهة أمامية Flutter
  تعمل بنمط offline-first وتتصل بـ Backend API خارجي.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  flutter_riverpod: ^2.5.1

  # التنقل بين الشاشات
  go_router: ^14.2.0

  # الشبكة
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # التخزين المحلي
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2

  # الإعدادات
  flutter_dotenv: ^5.1.0

  # الوسائط
  video_player: ^2.8.7
  chewie: ^1.8.1
  file_picker: ^8.0.6

  # أدوات
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # ملف الإعدادات المحلي (غير مرفوع للمستودع) — انسخه من .env.example
    - .env
