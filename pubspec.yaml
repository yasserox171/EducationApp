name: education_app
description: >-
  تطبيق تعليمي لمركز واحد (أستاذ واحد + تلاميذ) — واجهة أمامية Flutter
  تعمل بنمط offline-first وتتصل بـ Backend API خارجي.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  # 3.27 هو الحد الأدنى بسبب Color.withValues (بديل withOpacity المهجور).
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  flutter_riverpod: ^2.5.1

  # التنقل بين الشاشات
  go_router: ^14.2.0

  # الشبكة
  dio: ^5.4.3+1
  connectivity_plus: ^7.3.1

  # التخزين المحلي
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  # مثبّت على 10.x عمدًا: الإصدار 11 يطلب compileSdk 37، وأقصى ما يدعمه
  # AGP في قالب Flutter الحالي هو 36، فيفشل بناء أندرويد. ارفعه عندما
  # يصبح القالب داعمًا لـ 37.
  flutter_secure_storage: ^10.0.0

  # الإعدادات
  flutter_dotenv: ^5.1.0

  # الوسائط
  video_player: ^2.8.7
  chewie: ^1.8.1
  file_picker: ^12.2.0

  # أدوات
  uuid: ^4.4.0
  # يجب أن يطابق ما يثبّته flutter_localizations.
  intl: ^0.20.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    # ملف الإعدادات المحلي (غير مرفوع للمستودع) — انسخه من .env.example
    - .env
